<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Une règle, plusieurs regards</title><desc id="desc">Chaque preuve répond à une question différente. Unitaire: La règle calcule juste; API + base: Le serveur refuse sans écrire; Parcours E2E: L&#x27;utilisateur atteint le résultat; Observation: Le rendu reste utilisable. Un succès à un niveau ne dispense pas des autres preuves applicables.</desc>
<rect width="1200" height="460" rx="14" fill="#F7F8FA"/><g font-family="Arial, sans-serif">
<text x="32" y="44" font-size="24" fill="#4B5563" font-weight="400"><tspan x="32" dy="0">Chaque preuve répond à une question différente.</tspan></text>
<rect x="32" y="106" width="552" height="116" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="50" y="124" width="5" height="80" rx="2" fill="#D9CF4A"/>
<text x="69" y="143" font-size="25" fill="#23468C" font-weight="700"><tspan x="69" dy="0">Unitaire</tspan></text>
<text x="69" y="175" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="69" dy="0">La règle calcule juste</tspan></text>
<rect x="614" y="106" width="552" height="116" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="632" y="124" width="5" height="80" rx="2" fill="#D9CF4A"/>
<text x="651" y="143" font-size="25" fill="#23468C" font-weight="700"><tspan x="651" dy="0">API + base</tspan></text>
<text x="651" y="175" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="651" dy="0">Le serveur refuse sans écrire</tspan></text>
<rect x="32" y="239" width="552" height="116" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="50" y="257" width="5" height="80" rx="2" fill="#D9CF4A"/>
<text x="69" y="276" font-size="25" fill="#23468C" font-weight="700"><tspan x="69" dy="0">Parcours E2E</tspan></text>
<text x="69" y="308" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="69" dy="0">L&#x27;utilisateur atteint le résultat</tspan></text>
<rect x="614" y="239" width="552" height="116" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
