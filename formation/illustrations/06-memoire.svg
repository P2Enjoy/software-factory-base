<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">La mémoire appartient au projet</title><desc id="desc">Des documents courts répondent à des questions distinctes. README: Comment exécuter ?; DAT: Comment cela fonctionne ?; BACKLOG: Que reste-t-il à faire ?; JOURNAL: Pourquoi et où reprendre ?. Le CHANGELOG distingue changement présent et publication effectivement vérifiée.</desc>
