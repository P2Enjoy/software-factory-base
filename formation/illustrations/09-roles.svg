<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Un responsable, des missions bornées</title><desc id="desc">Le principal vérifie et décide ; les rôles auxiliaires rendent des constats. Principal: Seul éditeur et décideur; Explorer: Cartographier un flux; Reviewer: Relire un changement; Verifier: Exécuter une preuve ciblée. Le vérificateur compare l&#x27;état avant/après ; aucune édition concurrente.</desc>
