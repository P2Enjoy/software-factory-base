<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Ce que chaque contrôle établit</title><desc id="desc">La forme, le sens et le comportement ont des preuves différentes. Instruction: Fixe la règle; Hook / CI: Calcule un invariant; Revue: Examine la pertinence; Exécution: Éprouve le comportement. Les entrées du contrôle déterminent la portée de son résultat.</desc>
<rect width="1200" height="460" rx="14" fill="#F7F8FA"/><g font-family="Arial, sans-serif">
<text x="32" y="44" font-size="24" fill="#4B5563" font-weight="400"><tspan x="32" dy="0">La forme, le sens et le comportement ont des preuves différentes.</tspan></text>
