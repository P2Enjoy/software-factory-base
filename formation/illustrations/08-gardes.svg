<text x="69" y="215" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="69" dy="0">Fixe la règle</tspan></text>
<rect x="327" y="146" width="251" height="160" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="345" y="164" width="5" height="124" rx="2" fill="#D9CF4A"/>
<text x="364" y="183" font-size="25" fill="#23468C" font-weight="700"><tspan x="364" dy="0">Hook / CI</tspan></text>
<text x="364" y="215" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="364" dy="0">Calcule un</tspan><tspan x="364" dy="26.25">invariant</tspan></text>
<rect x="622" y="146" width="251" height="160" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="640" y="164" width="5" height="124" rx="2" fill="#D9CF4A"/>
<text x="659" y="183" font-size="25" fill="#23468C" font-weight="700"><tspan x="659" dy="0">Revue</tspan></text>
<text x="659" y="215" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="659" dy="0">Examine la</tspan><tspan x="659" dy="26.25">pertinence</tspan></text>
<rect x="917" y="146" width="251" height="160" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="935" y="164" width="5" height="124" rx="2" fill="#D9CF4A"/>
<text x="954" y="183" font-size="25" fill="#23468C" font-weight="700"><tspan x="954" dy="0">Exécution</tspan></text>
<text x="954" y="215" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="954" dy="0">Éprouve le</tspan><tspan x="954" dy="26.25">comportement</tspan></text>
<path d="M32 391 H1168" stroke="#D9CF4A" stroke-width="4"/>
<text x="32" y="423" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="32" dy="0">Les entrées du contrôle déterminent la portée de son résultat.</tspan></text>
