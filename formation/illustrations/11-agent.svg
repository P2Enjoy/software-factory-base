<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">L&#x27;agent agit dans un environnement</title><desc id="desc">Une réponse devient une action par un outil autorisé. Mission: Résultat et limites; Modèle: Propose l&#x27;action; Outil: Exécute dans sa portée; Observation: Informe la suite. Une capacité technique ne remplace ni l&#x27;autorisation ni la pertinence de l&#x27;action.</desc>
