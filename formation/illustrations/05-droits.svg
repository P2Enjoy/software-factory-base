<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Qui peut clore cette demande ?</title><desc id="desc">Le serveur croise rôle et propriété de la ressource. Alice: Responsable : toute demande; Bob: Contributeur : ses demandes; Eve: Lectrice : aucune écriture. Un refus est prouvé par sa réponse ET par l&#x27;absence de mutation.</desc>
<rect width="1200" height="460" rx="14" fill="#F7F8FA"/><g font-family="Arial, sans-serif">
<text x="32" y="44" font-size="24" fill="#4B5563" font-weight="400"><tspan x="32" dy="0">Le serveur croise rôle et propriété de la ressource.</tspan></text>
<rect x="32" y="138" width="356" height="184" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="50" y="156" width="5" height="148" rx="2" fill="#D9CF4A"/>
<text x="69" y="175" font-size="25" fill="#23468C" font-weight="700"><tspan x="69" dy="0">Alice</tspan></text>
<text x="69" y="207" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="69" dy="0">Responsable : toute demande</tspan></text>
<rect x="422" y="138" width="356" height="184" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="440" y="156" width="5" height="148" rx="2" fill="#D9CF4A"/>
<text x="459" y="175" font-size="25" fill="#23468C" font-weight="700"><tspan x="459" dy="0">Bob</tspan></text>
<text x="459" y="207" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="459" dy="0">Contributeur : ses demandes</tspan></text>
<rect x="812" y="138" width="356" height="184" rx="12" fill="white" stroke="#23468C" stroke-width="2"/>
<rect x="830" y="156" width="5" height="148" rx="2" fill="#D9CF4A"/>
<text x="849" y="175" font-size="25" fill="#23468C" font-weight="700"><tspan x="849" dy="0">Eve</tspan></text>
<text x="849" y="207" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="849" dy="0">Lectrice : aucune écriture</tspan></text>
<path d="M32 391 H1168" stroke="#D9CF4A" stroke-width="4"/>
<text x="32" y="423" font-size="21" fill="#0D0D0D" font-weight="400"><tspan x="32" dy="0">Un refus est prouvé par sa réponse ET par l&#x27;absence de mutation.</tspan></text>
</g></svg>