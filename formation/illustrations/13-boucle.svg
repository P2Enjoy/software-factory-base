<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">La boucle d&#x27;exécution d&#x27;une unité</title><desc id="desc">Des checkpoints conservent les états cohérents. Comprendre: Lire et spécifier; Persister: Décisions et références; Implémenter: Modifier dans le périmètre; Vérifier: Prouver et transmettre. Un défaut renvoie à sa cause ; un checkpoint ne signifie pas unité terminée.</desc>
