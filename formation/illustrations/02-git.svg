<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Quatre lieux, quatre états</title><desc id="desc">L&#x27;édition, la sélection, l&#x27;historique et la copie distante sont distincts. Fichier: État de travail; Index: Sélection par git add; Commit: Instantané local; Remote: Commits transmis. git diff examine le travail ; git diff --cached examine la sélection.</desc>
